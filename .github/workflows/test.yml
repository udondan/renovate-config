---
name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Always the latest Renovate, as the hosted Renovate app runs the latest
      # version too.
      - name: Validate config
        run: npx --yes --package renovate renovate-config-validator --strict default.json renovate.json

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
